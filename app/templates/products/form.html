{% extends 'base.html' %}
{% block title %}{% if product %}Edit{% else %}Add{% endif %} Product – Chai House AI{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-box-seam me-2 text-warning"></i>{% if product %}Edit{% else %}Add{% endif %} Product</h2>
  <a href="{{ url_for('products.list_products') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back to Products
  </a>
</div>
<div class="card" style="max-width:540px">
  <div class="card-body p-4">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Product Name *</label>
        <input type="text" name="name" class="form-control" required
               value="{{ product.name if product else '' }}" placeholder="e.g. Masala Tea">
      </div>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Selling Price (₹) *</label>
          <input type="number" name="selling_price" class="form-control" step="0.01" min="0.01" required
                 value="{{ product.selling_price if product else '' }}" placeholder="e.g. 20">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Cost Price (₹)</label>
          <input type="number" name="cost_price" class="form-control" step="0.01" min="0"
                 value="{{ product.cost_price if product else '' }}" placeholder="e.g. 8">
        </div>
      </div>
      <div class="mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="is_active" id="isActive"
                 {% if not product or product.is_active %}checked{% endif %}>
          <label class="form-check-label" for="isActive">Active (visible in sales form)</label>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-warning flex-grow-1">
          <i class="bi bi-check-lg me-1"></i>{% if product %}Update{% else %}Add{% endif %} Product
        </button>
        <a href="{{ url_for('products.list_products') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
